    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Triagem]
      summary: Consultar triagem completa
      operationId: consultarTriagemCompleta
      description: |
        Endpoint sensível. Exige `triagem:consultar_sensivel` e grava evento
        CONSULTAR_SENSIVEL na auditoria antes de responder (RNF-05, RNF-07).
      responses:
        '200':
          description: Triagem completa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriagemDetalhe' }

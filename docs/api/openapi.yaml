openapi: 3.1.0

info:
  title: API - Sistema de Gestão de Filas para Clínicas-Escola
  version: 1.0.0
  description: |
    Contrato da API do sistema de gestão de filas de atendimento em clínicas-escola.

    Convenções gerais, autenticação, erros, paginação e eventos de tempo real estão em
    `docs/04-contrato-api.md`. Cada operação cita os identificadores da especificação
    original (RF, RN, UC) no campo `description`.

    Regra do projeto: este arquivo é alterado por PR próprio e mergeado antes da
    implementação em qualquer uma das pontas.
  contact:
    name: Time do projeto

servers:
  - url: http://localhost:3333/api/v1
    description: Desenvolvimento
  - url: https://hml.filas.local/api/v1
    description: Homologação

tags:
  - name: Autenticação
    description: Login, refresh e sessão (T-01, RNF-01)
  - name: Perfis e permissões
    description: RF-02, UC-04, RNF-01
  - name: Cadastros base
    description: RF-01, UC-01 a UC-03
  - name: Triagem
    description: RF-03, UC-05
  - name: Senhas
    description: RF-04, UC-06, UC-07
  - name: Filas e chamadas
    description: RF-04, RF-05, UC-08, UC-09
  - name: Alocação
    description: RF-06, UC-10
  - name: Atendimento
    description: RF-07, UC-11 a UC-13
  - name: Encaminhamento
    description: RF-08, UC-14, UC-15
  - name: Ausências e desistências
    description: RF-09, UC-16, UC-17
  - name: Indicadores
    description: RF-10, UC-18
  - name: Alertas de SLA
    description: RF-11, UC-19
  - name: Auditoria
    description: RF-12, UC-20
  - name: Público
    description: Sem autenticação - telão e consulta de senha (W-09, W-10)

security:
  - bearerAuth: []

paths:
  # ─────────────────────────────── Autenticação ───────────────────────────────
  /auth/login:
    post:
      tags: [Autenticação]
      summary: Autenticar usuário
      operationId: autenticarUsuario
      description: |
        Retorna access token no corpo e refresh token no cookie `filas_refresh`
        (`HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth`). Credencial inválida retorna
        sempre a mesma resposta para usuário inexistente, senha incorreta e conta inativa.
        A quinta falha seguida bloqueia novos logins por 15 minutos (T-01); sessões já abertas
        continuam. Todo usuário tem perfil (`usuario.perfil_id` é obrigatório), por isso não
        há resposta de "conta sem perfil".
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identificacao, senha]
              properties:
                identificacao:
                  type: string
                  description: Matrícula ou e-mail institucional
                  example: '2021001234'
                senha:
                  type: string
                  format: password
                manterConectado:
                  type: boolean
                  default: false
                  description: |
                    `false`: cookie de refresh de sessão (some ao fechar o navegador).
                    `true`: cookie persistente até o fim da sessão. Nos dois casos a sessão
                    expira 8 horas depois do login. Não deve ser oferecido em terminal compartilhado.
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  expiraEm: { type: integer, description: Segundos até expirar }
                  usuario: { $ref: '#/components/schemas/UsuarioSessao' }
        '401':
          description: Credencial inválida ou conta bloqueada
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problema'
                  - type: object
                    properties:
                      minutosRestantes:
                        type: integer
                        description: Só em `BLOQUEIO_TEMPORARIO`; minutos até liberar novo login
              examples:
                credencialInvalida:
                  value:
                    title: Não foi possível entrar
                    status: 401
                    codigo: CREDENCIAL_INVALIDA
                    detail: Identificação ou senha incorreta. Verifique os dados e tente novamente.
                bloqueado:
                  value:
                    title: Acesso bloqueado temporariamente
                    status: 401
                    codigo: BLOQUEIO_TEMPORARIO
                    detail: Excesso de tentativas. Tente novamente em 12 minutos.
                    minutosRestantes: 12

  /auth/refresh:
    post:
      tags: [Autenticação]
      summary: Renovar access token
      operationId: renovarAccessToken
      description: |
        Usa o refresh token do cookie `filas_refresh` e devolve um cookie novo (rotação).
        Um refresh já trocado, apresentado de novo depois de 30 segundos, revoga a sessão.
        A renovação não estende a sessão além das 8 horas do login.
      security: []
      responses:
        '200':
          description: Token renovado
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  expiraEm: { type: integer }
        '401': { $ref: '#/components/responses/NaoAutenticado' }

  /auth/logout:
    post:
      tags: [Autenticação]
      summary: Encerrar sessão
      operationId: encerrarSessao
      description: |
        Invalida o refresh token do cookie, limpa o cookie e registra LOGOUT na auditoria (RNF-05).
        Funciona mesmo com o access token expirado; sem cookie válido, responde 204 do mesmo jeito.
      security: []
      responses:
        '204': { description: Sessão encerrada }
  /auth/me:
    get:
      tags: [Autenticação]
      summary: Dados da sessão atual
      operationId: dadosDaSessaoAtual
      description: Usado pelo front para montar o menu por permissão (RNF-01).
      responses:
        '200':
          description: Sessão atual
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsuarioSessao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }

  # ───────────────────────── Perfis, permissões, usuários ─────────────────────
  /permissoes:
    get:
      tags: [Perfis e permissões]
      summary: Catálogo de permissões
      operationId: catalogoDePermissoes
      description: |
        Alimenta a matriz de permissões de W-05. Módulos que envolvem dado de saúde ou
        registro de auditoria vêm com `sensivel: true` para a marcação visual exigida em T-05.
      responses:
        '200':
          description: Catálogo
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    modulo: { type: string, example: triagem }
                    rotulo: { type: string, example: Triagem }
                    sensivel: { type: boolean }
                    operacoes:
                      type: array
                      items:
                        type: object
                        properties:
                          operacao: { type: string, example: consultar }
                          permissao: { type: string, example: 'triagem:consultar' }

        '403': { $ref: '#/components/responses/SemPermissao' }
  /perfis:
    get:
      tags: [Perfis e permissões]
      summary: Listar perfis
      operationId: listarPerfis
      parameters:
        - { $ref: '#/components/parameters/Pagina' }
        - { $ref: '#/components/parameters/Tamanho' }
        - { $ref: '#/components/parameters/Busca' }
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespostaPaginada'
                  - type: object
                    properties:
                      dados:
                        type: array
                        items: { $ref: '#/components/schemas/Perfil' }
        '403': { $ref: '#/components/responses/SemPermissao' }
    post:
      tags: [Perfis e permissões]
      summary: Criar perfil
      operationId: criarPerfil
      description: |
        UC-04, RF-02. Perfil salvo sem nenhuma permissão de consulta é aceito, mas a resposta
        traz o aviso `PERFIL_SEM_CONSULTA` em `avisos[]` para a confirmação descrita em T-05.
        Nome único sem diferenciar maiúsculas. Permissão fora do catálogo retorna 422.
        `sistema` nunca é aceito no corpo: perfil criado pela API não é do sistema.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PerfilEntrada' }
      responses:
        '201':
          description: Perfil criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Perfil' }
        '409': { $ref: '#/components/responses/Duplicidade' }
        '422': { $ref: '#/components/responses/ErroValidacao' }

  /perfis/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Perfis e permissões]
      summary: Consultar perfil
      operationId: consultarPerfil
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Perfil' }
        '403': { $ref: '#/components/responses/SemPermissao' }
    put:
      tags: [Perfis e permissões]
      summary: Atualizar perfil
      operationId: atualizarPerfil
      description: |
        Perfil de sistema não é editável (T-05): 409 `PERFIL_SISTEMA`. A resposta traz
        `usuariosAfetados` (usuários vinculados, quando o conjunto de permissões mudou; 0 se não
        mudou) para a mensagem "altera permissões de N usuários". A mudança vale na próxima
        requisição de cada usuário (`docs/04` §3).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PerfilEntrada' }
      responses:
        '200':
          description: Perfil atualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Perfil'
                  - type: object
                    properties:
                      usuariosAfetados: { type: integer }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '409': { $ref: '#/components/responses/Conflito' }
    delete:
      tags: [Perfis e permissões]
      summary: Excluir perfil
      operationId: excluirPerfil
      description: |
        Bloqueado quando há usuários vinculados: 409 `VINCULO_ATIVO` (T-05). Perfil de sistema:
        409 `PERFIL_SISTEMA`.
      responses:
        '204': { description: Excluído }
        '409': { $ref: '#/components/responses/Conflito' }

  /usuarios:
    get:
      tags: [Perfis e permissões]
      summary: Listar usuários
      operationId: listarUsuarios
      parameters:
        - { $ref: '#/components/parameters/Pagina' }
        - { $ref: '#/components/parameters/Tamanho' }
        - { $ref: '#/components/parameters/Busca' }
        - { name: perfilId, in: query, schema: { type: string, format: uuid } }
        - { name: ativo, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespostaPaginada'
                  - type: object
                    properties:
                      dados:
                        type: array
                        items: { $ref: '#/components/schemas/Usuario' }
        '403': { $ref: '#/components/responses/SemPermissao' }
    post:
      tags: [Perfis e permissões]
      summary: Criar usuário
      operationId: criarUsuario
      description: |
        Permissão `perfis:criar`. `identificacao` é gravada em minúsculas e sem espaços nas pontas
        e é única. A senha inicial é obrigatória (8 a 128 caracteres) e só o hash é gravado.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsuarioEntrada' }
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '409': { $ref: '#/components/responses/Duplicidade' }
        '422': { $ref: '#/components/responses/ErroValidacao' }

  /usuarios/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Perfis e permissões]
      summary: Consultar usuário
      operationId: consultarUsuario
      description: Permissão `perfis:consultar`. Nunca devolve a senha nem o hash.
      responses:
        '200':
          description: Usuário
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '403': { $ref: '#/components/responses/SemPermissao' }
    patch:
      tags: [Perfis e permissões]
      summary: Alterar usuário
      operationId: alterarUsuario
      description: |
        Permissão `perfis:editar`. Altera nome, perfil, situação ou senha e desbloqueia o login
        (`desbloquear: true` zera as tentativas). Não há exclusão de usuário: a trilha de
        auditoria aponta para ele e é retida por 5 anos; inativar substitui excluir.
        Inativar ou redefinir a senha encerra as sessões abertas do usuário. Quem está logado
        não pode inativar o próprio usuário nem trocar o próprio perfil (422).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsuarioAlteracao' }
      responses:
        '200':
          description: Usuário alterado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '422': { $ref: '#/components/responses/ErroValidacao' }

  # ─────────────────────────────── Cadastros base ─────────────────────────────
  /pacientes:
    get:
      tags: [Cadastros base]
      summary: Listar pacientes
      operationId: listarPacientes
      description: |
        UC-03, RF-01. Filtros de W-03 - nome, vínculo e situação de restrição.
        A resposta usa nome completo apenas aqui, onde o cadastro é o próprio objeto da tela;
        em fila e painel o nome vem abreviado (P-03).
      parameters:
        - { $ref: '#/components/parameters/Pagina' }
        - { $ref: '#/components/parameters/Tamanho' }
        - { $ref: '#/components/parameters/Busca' }
        - { name: ordenar, in: query, schema: { type: string, enum: [nome], default: nome } }
        - { $ref: '#/components/parameters/Direcao' }
        - name: vinculo
          in: query
          schema: { $ref: '#/components/schemas/VinculoPaciente' }
        - name: comRestricao
          in: query
          description: Filtra pacientes com restrição ativa por reincidência (RN-13)
          schema: { type: boolean }
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespostaPaginada'
                  - type: object
                    properties:
                      dados:
                        type: array
                        items: { $ref: '#/components/schemas/Paciente' }
        '403': { $ref: '#/components/responses/SemPermissao' }
    post:
      tags: [Cadastros base]
      summary: Cadastrar paciente
      operationId: cadastrarPaciente
      description: UC-01, RF-01. Verifica duplicidade por documento (W-04).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PacienteEntrada' }
      responses:
        '201':
          description: Cadastrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Paciente' }
        '409': { $ref: '#/components/responses/Duplicidade' }
        '422': { $ref: '#/components/responses/ErroValidacao' }

  /pacientes/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Cadastros base]
      summary: Consultar paciente
      operationId: consultarPaciente
      description: |
        Traz `avisos[]` com PACIENTE_COM_RESTRICAO quando há reincidência de ausências.
        O aviso não bloqueia a triagem (RN-13, W-06).
      responses:
        '200':
          description: Paciente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PacienteDetalhe' }
        '403': { $ref: '#/components/responses/SemPermissao' }
    put:
      tags: [Cadastros base]
      summary: Editar paciente
      operationId: editarPaciente
      description: UC-02, RF-01
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PacienteEntrada' }
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Paciente' }
        '422': { $ref: '#/components/responses/ErroValidacao' }
    delete:
      tags: [Cadastros base]
      summary: Excluir paciente
      operationId: excluirPaciente
      description: |
        Só é permitido quando não há vínculo ativo com fila, alocação ou atendimento.
        Com vínculo, retorna VINCULO_ATIVO e a UI oferece inativar (T-03).
      responses:
        '204': { description: Excluído }
        '409': { $ref: '#/components/responses/Conflito' }

    patch:
      tags: [Cadastros base]
      summary: Ativar ou inativar paciente
      operationId: alterarSituacaoPaciente
      description: |
        Permissão `cadastros:editar`. Inativar substitui a exclusão quando o registro tem vínculo
        ativo (T-03): ele deixa de aparecer para novas operações e o histórico é mantido.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ativo]
              properties:
                ativo: { type: boolean }
      responses:
        '200':
          description: Situação alterada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Paciente' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '422': { $ref: '#/components/responses/ErroValidacao' }
  /estudantes:
    get:
      tags: [Cadastros base]
      summary: Listar estudantes/atendentes
      operationId: listarEstudantesAtendentes
      description: Filtros de W-03 - especialidade, nível e disponibilidade.
      parameters:
        - { $ref: '#/components/parameters/Pagina' }
        - { $ref: '#/components/parameters/Tamanho' }
        - { $ref: '#/components/parameters/Busca' }
        - { name: ordenar, in: query, schema: { type: string, enum: [nome], default: nome } }
        - { $ref: '#/components/parameters/Direcao' }
        - name: nivelFormacao
          in: query
          description: Nível de formação exato, sem diferenciar maiúsculas (filtro de T-03)
          schema: { type: string }
        - { name: especialidadeId, in: query, schema: { type: string, format: uuid } }
        - { name: turno, in: query, schema: { $ref: '#/components/schemas/Turno' } }
        - { name: disponivel, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespostaPaginada'
                  - type: object
                    properties:
                      dados:
                        type: array
                        items: { $ref: '#/components/schemas/Estudante' }
        '403': { $ref: '#/components/responses/SemPermissao' }
    post:
      tags: [Cadastros base]
      summary: Cadastrar estudante/atendente
      operationId: cadastrarEstudanteAtendente
      description: |
        RN-06 - especialidade, nível, habilitações e procedimentos autorizados. Habilitações,
        procedimentos e disponibilidade são obrigatórios, como no W-04. Duplicidade provisória
        por nome + especialidade, sem diferenciar maiúsculas (decisão pendente na #81).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EstudanteEntrada' }
      responses:
        '201':
          description: Cadastrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Estudante' }
        '409': { $ref: '#/components/responses/Duplicidade' }

  /estudantes/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Cadastros base]
      summary: Consultar estudante
      operationId: consultarEstudante
      responses:
        '200':
          description: Estudante
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Estudante' }
        '403': { $ref: '#/components/responses/SemPermissao' }
    put:
      tags: [Cadastros base]
      summary: Editar estudante
      operationId: editarEstudante
      description: |
        Alteração de especialidade ou habilitação que afete alocação em curso retorna
        `avisos[]` com o impacto antes de aplicar (T-04).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EstudanteEntrada' }
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Estudante' }
        '403': { $ref: '#/components/responses/SemPermissao' }
    delete:
      tags: [Cadastros base]
      summary: Excluir estudante
      operationId: excluirEstudante
      responses:
        '204': { description: Excluído }
        '409': { $ref: '#/components/responses/Conflito' }

    patch:
      tags: [Cadastros base]
      summary: Ativar ou inativar estudante
      operationId: alterarSituacaoEstudante
      description: |
        Permissão `cadastros:editar`. Inativar substitui a exclusão quando o registro tem vínculo
        ativo (T-03): ele deixa de aparecer para novas operações e o histórico é mantido.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ativo]
              properties:
                ativo: { type: boolean }
      responses:
        '200':
          description: Situação alterada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Estudante' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '422': { $ref: '#/components/responses/ErroValidacao' }
  /supervisores:
    get:
      tags: [Cadastros base]
      summary: Listar supervisores
      operationId: listarSupervisores
      description: |
        A coluna de disponibilidade exibe ocupação sobre o limite configurado, no formato
        "2 de 3" (RN-08, T-03) - vem em `ocupacaoAtual` e `limiteEstudantesSimultaneos`.
      parameters:
        - { $ref: '#/components/parameters/Pagina' }
        - { $ref: '#/components/parameters/Tamanho' }
        - { $ref: '#/components/parameters/Busca' }
        - { name: ordenar, in: query, schema: { type: string, enum: [nome], default: nome } }
        - { $ref: '#/components/parameters/Direcao' }
        - { name: especialidadeId, in: query, schema: { type: string, format: uuid } }
        - { name: turno, in: query, schema: { $ref: '#/components/schemas/Turno' } }
        - name: disponivel
          in: query
          description: Ativos com ocupação abaixo do limite (RN-08); a ocupação depende da alocação (#7)
          schema: { type: boolean }
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespostaPaginada'
                  - type: object
                    properties:
                      dados:
                        type: array
                        items: { $ref: '#/components/schemas/Supervisor' }
        '403': { $ref: '#/components/responses/SemPermissao' }
    post:
      tags: [Cadastros base]
      summary: Cadastrar supervisor
      operationId: cadastrarSupervisor
      description: RN-07, RN-08 - especialidades habilitadas, turnos e limite de estudantes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupervisorEntrada' }
      responses:
        '201':
          description: Cadastrado
          content:

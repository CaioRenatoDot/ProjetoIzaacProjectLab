# Infraestrutura local de desenvolvimento.
# Sobe apenas o banco (PostgreSQL 16) e o Adminer. As aplicações (api, web, publico)
# rodam no Node da máquina com `pnpm dev` — ver README.
#
# Uso:
#   cp .env.example .env
#   docker compose up -d
#   docker compose ps          # o serviço "db" deve aparecer como "healthy"
#
# Adminer: http://localhost:8080  (sistema: PostgreSQL, servidor: db)

name: filas-clinica-escola

services:
  db:
    image: postgres:16-alpine
    container_name: filas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-filas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-filas}
      POSTGRES_DB: ${POSTGRES_DB:-filas_dev}
      # Senha do usuário da aplicação (filas_app), criado por docker/postgres/init/02-*.sh.
      FILAS_APP_PASSWORD: ${FILAS_APP_PASSWORD:-filas_app}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Executado só na primeira criação do volume (banco de testes e usuário da aplicação).
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-filas} -d ${POSTGRES_DB:-filas_dev}']
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4.8.1
    container_name: filas-adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - '${ADMINER_PORT:-8080}:8080'

volumes:
  pgdata:
